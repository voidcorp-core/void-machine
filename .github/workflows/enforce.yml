# Reusable workflow: the void-machine enforcement floor for CONSUMER repos.
#
# Adopt it with five lines in your own repo (.github/workflows/void-enforce.yml):
#
#   name: void-enforce
#   on: pull_request
#   jobs:
#     enforce:
#       uses: voidcorp-core/void-machine/.github/workflows/enforce.yml@<full-sha>
#
# Pin the reusable workflow to a full commit SHA. This complements — it does not
# replace — your own lint/test CI: it enforces the doctrine floor only.
name: void-enforce (reusable)

on:
  workflow_call:
    inputs:
      base-ref:
        description: Ref to diff against (defaults to the PR base).
        required: false
        type: string
        default: ''

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives the base commit so the diff (and fail-closed base
      # resolution) works; a shallow checkout would make the base unresolvable.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # The `github` context belongs to the caller. These `job` contexts identify
      # the immutable reusable workflow implementation selected by the caller.
      # Ref: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
      - name: Check out the immutable enforcement implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .void-enforce-runtime
          persist-credentials: false
      # The caller need not declare Node: use the pinned implementation's file.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .void-enforce-runtime/.node-version
          package-manager-cache: false
      - uses: ./.void-enforce-runtime/.github/actions/void-enforce
        with:
          base-ref: ${{ inputs.base-ref }}
