# Workspaces for pnpm.
#
# packages/core/ is intentionally NOT a workspace: it holds static assets
# (claude/{skills,agents,hooks,modules}) consumed by the CLI at install time,
# not a published npm package.
packages:
  - 'packages/cli'
  - 'packages/packs/*'
  - 'packages/mission-engine'
  - 'packages/hook-runner'
  - 'apps/*'
  - 'packages/void-machine'

# Dependency resolution settings are read here by pnpm 12.
overrides:
  esbuild: '>=0.28.1'
  postcss: '>=8.5.18'

# esbuild installs and verifies its platform-specific binary.
allowBuilds:
  esbuild: true
