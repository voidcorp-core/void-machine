# Reusable workflow: the void-machine enforcement floor for CONSUMER repos.
#
# Adopt the caller example in README.md, preserving existing required names.
# Pin this reusable workflow to a reviewed full SHA. The caller owns readiness
# and merge_group triggers, plus PR-only concurrency; do not duplicate its group
# here because github.workflow belongs to the caller, even in a reusable job.
# This floor complements the consuming project's own lint/test CI.
name: void-enforce (reusable)

on:
  workflow_call:
    inputs:
      base-ref:
        description: Ref to diff against (defaults to the PR base).
        required: false
        type: string
        default: ''

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 gives the base commit so the diff (and fail-closed base
      # resolution) works; a shallow checkout would make the base unresolvable.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # The `github` context belongs to the caller. These `job` contexts identify
      # the immutable reusable workflow implementation selected by the caller.
      # Ref: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
      - name: Check out the immutable enforcement implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .void-enforce-runtime
          persist-credentials: false
      # Admission comes from the pinned implementation, not the caller's files.
      # Keep it inside the required job: a skipped required job reports success.
      - name: Admit integration enforcement
        run: node .void-enforce-runtime/packages/core/skills/void-verify/references/ci-admission.mjs
      # The caller need not declare Node: use the pinned implementation's file.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .void-enforce-runtime/.node-version
          package-manager-cache: false
      - uses: ./.void-enforce-runtime/.github/actions/void-enforce
        with:
          base-ref: ${{ inputs.base-ref }}
