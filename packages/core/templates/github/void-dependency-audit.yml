# Bun consumer template: adopt with dependency-audit.mjs and ci-admission.mjs.
# See docs/DEPENDENCY-AUDIT.md before adopting; no consumer CI is overwritten.
name: void-dependency-audit

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  # New advisories can affect an unchanged lockfile. Surveillance is not PR proof.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit dependency audit
        id: admission
        run: node .github/scripts/ci-admission.mjs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Classify dependency audit
        run: node .github/scripts/dependency-audit.mjs "$RUNNER_TEMP/dependency-audit"
      - name: Preserve audit report
        if: ${{ always() && steps.admission.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit
          if-no-files-found: error
          retention-days: 7
