name: test certification

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: test-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    name: seeded reliability stress
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Twenty deterministic fast-lane attempts
        env:
          VOID_STRESS_REPORT_PATH: ${{ runner.temp }}/test-proof/fast.json
        run: node scripts/stress-proof.mjs fast 20 10401
      - name: Ten deterministic complete attempts
        env:
          VOID_STRESS_REPORT_PATH: ${{ runner.temp }}/test-proof/complete.json
        run: node scripts/stress-proof.mjs complete 10 20401
      - name: Retain the exact-SHA stress reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-proof
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
