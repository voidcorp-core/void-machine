name: ci
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
    branches: [develop]
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
# Only obsolete revisions of the same PR cancel; queue groups and publication do not.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Promotion proves the current combined candidate. Queue groups use their combined SHA.
  GATE_SHA: ${{ github.event.pull_request.base.ref == 'main' && github.sha || github.event.pull_request.head.sha || github.sha }}
jobs:
  consumer-artifact:
    name: prepare validation
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.impact.outputs.docs }}
      engine: ${{ steps.impact.outputs.engine }}
      local: ${{ steps.impact.outputs.local }}
      network: ${{ steps.impact.outputs.network }}
      consumer: ${{ steps.impact.outputs.consumer }}
      crossPlatform: ${{ steps.impact.outputs.crossPlatform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.GATE_SHA }}
          fetch-depth: 0
      - name: Admit integration validation
        run: node packages/core/src/skills/void-verify/references/ci-admission.mjs
      - name: Select the checked-out candidate impact
        id: impact
        run: node scripts/verify.mjs --ci-impact --sha "$GATE_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Collect the small independent group, then refuse expensive dependent work.
      - name: Skill references
        id: references
        continue-on-error: true
        run: pnpm skills:check-references
      - name: Version lockstep
        id: version
        if: ${{ steps.impact.outputs.version != 'false' }}
        continue-on-error: true
        run: pnpm version:check
      - name: Anti-bloat
        id: structure
        if: ${{ steps.impact.outputs.docs != 'true' }}
        continue-on-error: true
        run: pnpm anti-bloat:check
      - name: Lint
        id: lint
        if: ${{ steps.impact.outputs.docs != 'true' }}
        continue-on-error: true
        run: pnpm lint
      - name: Require every applicable cheap check
        if: ${{ !cancelled() }}
        env:
          CHECKS_PASSED: ${{ steps.references.outcome == 'success' && (steps.impact.outputs.version == 'false' || steps.version.outcome == 'success') && (steps.impact.outputs.docs == 'true' || (steps.structure.outcome == 'success' && steps.lint.outcome == 'success')) }}
        run: test "$CHECKS_PASSED" = true
      # conformance:pack checks original committed deliveries before lifecycle generation.
      - name: Pack the exact candidate once
        if: ${{ steps.impact.outputs.docs != 'true' }}
        env:
          VOID_CONFORMANCE_ARTIFACT_DIR: ${{ runner.temp }}/consumer-artifact
        run: pnpm conformance:pack
      - name: Inspect publication content
        if: ${{ steps.impact.outputs.docs != 'true' }}
        env:
          VOID_CONFORMANCE_TARBALL: ${{ runner.temp }}/consumer-artifact/consumer.tgz
        run: pnpm check:publish
      - name: Check archive size
        if: ${{ steps.impact.outputs.docs != 'true' }}
        env:
          VOID_CONFORMANCE_TARBALL: ${{ runner.temp }}/consumer-artifact/consumer.tgz
        run: pnpm check:size
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ steps.impact.outputs.consumer == 'true' }}
        with:
          name: consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/consumer-artifact/consumer.tgz
            ${{ runner.temp }}/consumer-artifact/consumer.tgz.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  validate:
    if: ${{ !cancelled() }}
    needs: consumer-artifact
    runs-on: ubuntu-latest
    steps:
      # A failed/skipped/missing preparation is never a passing required validation.
      - name: Require successful preparation
        env:
          PREPARATION_RESULT: ${{ needs.consumer-artifact.result }}
        run: test "$PREPARATION_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.GATE_SHA }}
      - name: Admit integration validation
        run: node packages/core/src/skills/void-verify/references/ci-admission.mjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: ${{ needs.consumer-artifact.outputs.docs != 'true' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ needs.consumer-artifact.outputs.docs != 'true' }}
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: ${{ needs.consumer-artifact.outputs.docs != 'true' }}
      - name: Build before dependent checks
        if: ${{ needs.consumer-artifact.outputs.docs != 'true' }}
        run: pnpm build
      - name: Compile and inspect the isolated self-host
        if: ${{ needs.consumer-artifact.outputs.docs != 'true' }}
        run: |
          node packages/cli/dist/bin/void-machine.mjs self-host sync
          node packages/cli/dist/bin/void-machine.mjs self-host doctor
      - name: Typecheck
        if: ${{ needs.consumer-artifact.outputs.docs != 'true' }}
        run: pnpm typecheck
      - name: Engine tests
        if: ${{ needs.consumer-artifact.outputs.engine == 'true' }}
        run: pnpm test:engine
      - name: Local tests
        if: ${{ needs.consumer-artifact.outputs.local == 'true' }}
        run: pnpm test:local
      - name: Network tests
        if: ${{ needs.consumer-artifact.outputs.network == 'true' }}
        run: pnpm test:network

  # Explicit names keep required contexts conclusive when an OS is not applicable.
  # Native skipped jobs are NOT executed consumer proofs. YAML anchors share steps only.
  install-linux:
    name: install conformance (ubuntu-latest)
    needs: consumer-artifact
    if: ${{ needs.consumer-artifact.outputs.consumer == 'true' }}
    runs-on: ubuntu-latest
    steps: &consumer-steps
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.GATE_SHA }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-artifact
      - name: Exercise installed package, hooks and Autopilot
        run: pnpm conformance:consumer --tarball "${{ runner.temp }}/consumer-artifact/consumer.tgz"
  install-macos:
    name: install conformance (macos-latest)
    needs: consumer-artifact
    if: ${{ needs.consumer-artifact.outputs.consumer == 'true' && needs.consumer-artifact.outputs.crossPlatform == 'true' }}
    runs-on: macos-latest
    steps: *consumer-steps
  install-windows:
    name: install conformance (windows-latest)
    needs: consumer-artifact
    if: ${{ needs.consumer-artifact.outputs.consumer == 'true' && needs.consumer-artifact.outputs.crossPlatform == 'true' }}
    runs-on: windows-latest
    steps: *consumer-steps
