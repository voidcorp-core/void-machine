name: ci

on:
  # `develop` is where autonomous merging happens, so it needs the checks at
  # least as much as `main` does: a "all checks green" predicate is satisfied
  # by an ABSENCE of checks just as happily as by passing ones. Identical job
  # set on both branches — no reduced coverage on the autonomous side.
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # Release Please uses GITHUB_TOKEN, so its PR events do not run unattended.
  # release.yml dispatches this workflow explicitly on the release PR branch.
  workflow_dispatch: {}

jobs:
  install-conformance:
    name: install conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Which areas the diff touches
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/changed-areas.sh
      - name: Offline tarball install and hook execution for Claude, Codex and both
        run: |
          pnpm conformance:install
          pnpm conformance:hooks
      - name: ProjectGraph tests and typecheck
        # The kernel's own suite. Nothing it asserts can change while
        # packages/harness-graph and packages/mission-engine are untouched.
        if: steps.areas.outputs.graph == 'true'
        run: |
          pnpm --filter @voidcorp/harness-graph test
          pnpm --filter @voidcorp/harness-graph typecheck
      - name: Deterministic packed ProjectGraph subpath conformance
        if: steps.areas.outputs.graph == 'true'
        run: pnpm conformance:project-graph

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # decisions:check compares accepted records with the PR base SHA.
          # checkout fetches one commit by default, so retain the base history.
          fetch-depth: 0

      - name: Setup pnpm
        # No `version:` here: action-setup reads it from packageManager in
        # package.json (single source of truth). Specifying both errors with
        # ERR_PNPM_BAD_PM_VERSION on action-setup.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Which areas the diff touches
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/changed-areas.sh

      - name: Sister-doc parity (CLAUDE.md <-> AGENTS.md)
        # Section-heading parity after terminology normalization. Catches a
        # section added to one doc but not the other. The pre-commit hook
        # (.githooks/pre-commit) enforces the stricter both-or-neither rule
        # locally; CI enforces structural parity statelessly.
        run: pnpm sync:docs

      - name: Doctrine parity (docs/ <-> packages/core/ PHILOSOPHY.md)
        # The doctrine exists three times: docs/ (what we read), packages/core/
        # (what install writes into a consumer), and the core-assets npm mirror.
        # The mirror is generated and already gated by the core-assets step
        # below, so this one covers the leg nothing else did: docs <-> core.
        # They drifted on six sentences for two months, every heading intact,
        # which shipped consumers a doctrine older than the one we were reading.
        run: pnpm sync:philosophy

      - name: Version lockstep
        # Every version-carrying manifest (marketplace, 7 plugin.json, the
        # core-assets mirror, the 3 npm package.json) must equal the canonical
        # marketplace version. Catches any miss by the release automation, the
        # manual bumper, or a hand-edit before it ships a skewed install.
        run: pnpm version:check

      - name: Anti-bloat checks
        # Single source of truth: scripts/anti-bloat-check.sh enforces the size
        # caps (skills ≤400, hooks ≤100), hook shell syntax, AND the frontmatter
        # discovery description target ≤250 and hard cap 500 across core skills,
        # pack skills, agents, and canonical specialists. Inlining a subset here
        # let the agent description cap go unenforced in CI (it only ran locally).
        run: pnpm anti-bloat:check

      - name: Decision records valid and accepted records immutable
        # Each decision owns one file. The optional PR base also proves that an
        # accepted record was superseded, never rewritten or deleted in place.
        env:
          DECISIONS_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm decisions:check

      - name: Generated hook runner is current
        # Runtime hooks execute a checked-in, dependency-free bundle. Rebuild it
        # before mirroring core so source and shipped hot paths cannot diverge.
        run: |
          pnpm hooks:build
          if [ -n "$(git status --porcelain -- packages/core/hooks/_void-hook.mjs)" ]; then
            echo "FAIL: generated hook runner is stale." >&2
            echo "Run: pnpm hooks:build && commit the artifact." >&2
            exit 1
          fi

      - name: core-assets in sync with core
        # The CLI bundles packages/core as packages/cli/core-assets via
        # copy-core-assets.mjs. Regenerate and fail if the committed mirror
        # drifted, so the published CLI never ships a stale manifest or hooks.
        # Use `git status --porcelain`, not `git diff --quiet`: the latter only
        # sees modifications to TRACKED files, so a NEW core file whose mirror is
        # untracked would pass silently (#66). Porcelain catches modified,
        # untracked (??) and deleted paths alike.
        run: |
          pnpm --filter voidharness build:assets
          if [ -n "$(git status --porcelain -- packages/cli/core-assets)" ]; then
            echo "FAIL: core-assets is out of sync with packages/core." >&2
            echo "Run: pnpm --filter voidharness build:assets && commit the result." >&2
            git --no-pager status --porcelain -- packages/cli/core-assets >&2
            exit 1
          fi

      - name: Lint — Biome
        run: pnpm lint

      - name: Publish safety (no workspace protocol in npm packages)
        run: pnpm check:publish

      - name: Package size ceilings
        # Packs the same tarballs as the gate above and bounds what consumers
        # download. Prints every size on every run, so growth is a trajectory
        # rather than a one-day surprise.
        run: pnpm check:size

      - name: Build packages
        # Build before typecheck: packs resolve cross-package imports
        # (e.g. @voidcorp/pack-monorepo/result) through their dist exports,
        # so the type declarations must exist first.
        run: pnpm build

      - name: ProjectGraph performance and native capability report
        # Must run AFTER the build: it bundles harness-graph, whose sources import
        # @voidcorp/mission-engine through that package's dist exports. Placed
        # earlier it fails to resolve them, exactly as the comment above warns.
        if: steps.areas.outputs.graph == 'true'
        run: pnpm benchmark:project

      - name: ProjectGraph query performance report
        # Separate from the extraction benchmark above: these gates cover the
        # seven queries over a seeded corpus, where extraction cost is excluded
        # by construction so a query regression cannot hide behind it.
        if: steps.areas.outputs.graph == 'true'
        run: pnpm benchmark:query

      - name: Self-host release gate
        # Compile current sources into an isolated, gitignored Claude+Codex
        # artifact. The strict doctor rejects source-hash or owned-file drift;
        # unavailable native CLIs stay degraded until their certification lane.
        run: |
          node packages/cli/bin/void-harness.mjs self-host sync --mode release-gate
          node packages/cli/bin/void-harness.mjs self-host doctor --mode release-gate

      - name: Graph integrity (model drift + broken routes)
        run: pnpm graph:check

      - name: Generated artefacts are current (one gate for all of them)
        # Seven artefacts derive from the skills, agents, hooks, commands and
        # packs. Each used to have its own build command and its own freshness
        # gate, and nothing declared the set: renaming thirteen skills found them
        # one at a time, in series, a push apart, and the seventh was found here
        # rather than by the commit that caused it. This derives and asserts the
        # tree is unchanged, so an eighth artefact is covered the day it is added
        # without anyone remembering to add a step. Stale? `pnpm derive`.
        run: pnpm derive:check

      - name: Consumer bundle freshness (void-graph.mjs embeds the current model)
        # The one artefact `derive:check` does not byte-compare, because the vite
        # and esbuild output is not guaranteed byte-identical across environments.
        # This gates the model it bakes against the committed one, which is the
        # fact that matters and does not depend on the bundler.
        run: pnpm graph:check-bundle

      - name: Asset paths resolve (no route into a moved directory)
        # Skills are prose an agent reads, and they name paths in it. When the
        # layout moves, those sentences are wrong and nothing says so: moving the
        # programme pointer left four assets routing to an obsolete path, found by
        # reading rather than by the build, and this found four more on its first
        # run. A generated bindings file was the alternative and was rejected: a
        # skill's value is that it reads as prose, and a placeholder costs that.
        run: pnpm skills:check-paths

      - name: Skill references resolve (no link into a renamed skill)
        # A skill's identity is its directory name, copied by hand into routing
        # tables, commands and sourcing notes. Renaming session-handoff to
        # checkpoint left four references pointing at nothing, and an audit found
        # them weeks later rather than the build. This makes a rename mechanical.
        run: pnpm skills:check-references

      - name: Skill tests
        run: pnpm vitest run

      - name: TypeScript — typecheck packages
        run: pnpm -r typecheck
