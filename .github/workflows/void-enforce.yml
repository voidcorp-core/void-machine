# void-machine dogfoods its OWN enforcement floor on every PR. Uses the LOCAL
# composite (./.github/actions/void-enforce) so the check runs THIS PR's code,
# not the last released version — a change to a check is validated by the same
# PR that makes it. Consumers use the reusable workflow (enforce.yml) instead.
#
# Kept separate from ci.yml on purpose: ci.yml gates build/lint/tests (general
# quality), this gates the doctrine floor. The ticket forbids doubling them.
name: void-enforce

on:
  # Both bases, for the same reason ci.yml runs on both: `enforce` is a required
  # check on `develop` too, and a required check whose workflow never fires is a
  # gate that blocks forever instead of a gate that judges.
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, auto_merge_enabled, auto_merge_disabled]
  # The merge queue on `develop` waits for its required checks on this event
  # only. `enforce` then diffs the group commit against the group base, which
  # the composite reads from the merge_group payload.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#merge_group
  merge_group:
    types: [checks_requested]
    branches: [develop]
  # release.yml dispatches this workflow on Release Please PRs so the same
  # doctrine floor required by branch protection runs before their merge.
  workflow_dispatch:
    inputs:
      base-ref:
        description: Trusted base ref used to enforce the dispatched branch diff.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Admit integration validation
        run: node packages/core/skills/void-verify/references/ci-admission.mjs
      # Auto-merge is the default way into develop: it waits for protection and
      # every required check. The live state is read, not the event payload, so
      # the step judges what is armed now. Only main refuses it: the promotion
      # and the release pull request are merged by a person (docs/RELEASING.md).
      - name: Reject auto-merge into main
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OBSERVED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY: voidcorp-core/void-machine
          FORBIDDEN_BASE: main
        run: |
          set -euo pipefail
          if [ "$OBSERVED_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "auto-merge authority is defined only for $EXPECTED_REPOSITORY." >&2
            exit 1
          fi

          pr=$(gh pr view "$PR_NUMBER" --repo "$EXPECTED_REPOSITORY" \
            --json autoMergeRequest,baseRefName,headRefName)
          PR_JSON="$pr" node --input-type=module <<'NODE'
          import { assertAutoMergeAllowed } from './scripts/auto-merge-contract.mjs';

          const outcome = assertAutoMergeAllowed(JSON.parse(process.env.PR_JSON), {
            repository: process.env.EXPECTED_REPOSITORY,
            forbiddenBase: process.env.FORBIDDEN_BASE,
          });
          process.stdout.write(`${outcome}\n`);
          NODE
      # This source repository uses compiler-backed TDD declarations. The
      # composite never installs consumer tooling; this caller owns provisioning.
      # https://github.com/pnpm/action-setup/tree/v6
      # https://github.com/actions/setup-node/tree/v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/void-enforce
        with:
          base-ref: ${{ inputs.base-ref }}
