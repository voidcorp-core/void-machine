name: release

# Automated, lockstep releasing driven by Conventional Commits (which this repo
# already enforces). On every push to main, release-please maintains a single
# "release PR" that bumps the canonical version across ALL manifests (via
# extra-files in release-please-config.json) and writes the changelog. Merging
# that PR tags `vX.Y.Z` and cuts a GitHub release. No one hand-bumps a version.
#
# The routine chain has exactly two deliberate human actions, both on pull
# requests: merge the develop-to-main promotion, then merge the release-please
# version/changelog PR. The second merge cuts the release and authorizes this
# workflow to publish. There is no Actions approval or publish button.

on:
  push:
    branches: [main]
  # Exceptional recovery only. The tag must already have a matching GitHub
  # Release and resolve to a commit reachable from protected main.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to retry (vX.Y.Z).
        required: true
        type: string

# `contents` and `pull-requests` are what release-please writes with. `actions:
# write` is deliberately absent: it existed only to dispatch and approve the
# release PR's own checks, which the App token makes unnecessary.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Same ref restriction as `publish` below. This job holds the App token that
    # opens and pushes the release PR; a dispatch fired from another branch has
    # no business holding it either.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request opened with GITHUB_TOKEN does not trigger workflows. That
      # is a deliberate GitHub anti-recursion rule, not a setting, and it used to
      # force ~90 lines here: resolve the release PR, dispatch every required
      # workflow at its head, then approve the runs sitting at `action_required`.
      # It fought the platform and it broke twice on races.
      #
      # A GitHub App token is not GITHUB_TOKEN, so the pull request it opens
      # triggers workflows like any other. The machinery below it is gone.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # No downstream catalog to notify: the marketplace is self-hosted in this
      # repo (`.claude-plugin/marketplace.json`, local `./packages/...` sources
      # resolved at HEAD), so a release needs no sha re-pinning anywhere.

  validate-release:
    needs: release-please
    if: ${{ always() && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-please.outputs.tag_name }}
      EXPECTED_REPOSITORY: voidcorp-core/void-machine
      CONTROL_ROOT: ${{ github.workspace }}/release-control
      RELEASE_TREE: ${{ github.workspace }}/release-tree
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_commit: ${{ steps.resolve.outputs.release_commit }}
      tarball_name: ${{ steps.prepare.outputs.tarball_name }}
      sha256: ${{ steps.prepare.outputs.sha256 }}
      integrity: ${{ steps.prepare.outputs.integrity }}
      artifact_name: npm-release-${{ steps.resolve.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      # Keep the workflow implementation separate from the tree being released.
      # A recovery may target an older tag that does not contain today's verifier.
      - name: Check out the release control implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: release-control
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Resolve the immutable tag, release and protected-main ancestry
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-control/scripts/prepare-release-artifact.mjs resolve

      - name: Check out the exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.resolve.outputs.release_commit }}
          fetch-depth: 0
          path: release-tree
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: release-tree/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-tree/pnpm-lock.yaml

      - name: Install the immutable release tree
        working-directory: release-tree
        run: pnpm install --frozen-lockfile

      - name: Validate the immutable release tree without OIDC
        working-directory: release-tree
        run: |
          pnpm version:check
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm check:publish

      - name: Pack the final npm tarball exactly once
        working-directory: release-tree
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/npm-release
        run: |
          mkdir -p "$ARTIFACT_DIR"
          pnpm --filter ./packages/cli pack --pack-destination "$ARTIFACT_DIR"

      - name: Bind package identity and byte integrity
        id: prepare
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/npm-release
          RELEASE_COMMIT: ${{ steps.resolve.outputs.release_commit }}
        run: node release-control/scripts/prepare-release-artifact.mjs prepare

      - name: Upload the validated tarball and integrity manifest
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-release-${{ steps.resolve.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.tarball_path }}
            ${{ steps.prepare.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 1

  # This is the only OIDC-capable job. It executes no repository or package
  # lifecycle code: validation packed the final bytes once, and this job only
  # authenticates the immutable cross-job artifact before publishing that local
  # tarball through npm Trusted Publishing.
  publish:
    needs: [release-please, validate-release]
    if: ${{ always() && needs.validate-release.result == 'success' }}
    runs-on: ubuntu-latest
    # At most 24m50s of registry HTTP waits and pauses, plus 5m10s for setup,
    # artifact verification and publishing. This is a hard job ceiling, not an npm SLA.
    timeout-minutes: 30
    outputs:
      publication_mode: ${{ steps.registry.outputs.state }}
    concurrency:
      group: npm-release-publish
      cancel-in-progress: false
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXPECTED_REPOSITORY: voidcorp-core/void-machine
      EXPECTED_PACKAGE: voidmachine
      MINIMUM_NPM_VERSION: 11.5.1
      MAX_CLASSIFICATION_ATTEMPTS: 3
      # DEV-916: 4.0.0 took ~6 minutes to propagate. Twice that observation gives
      # 72 ten-second pauses plus an immediate first observation (73 total).
      # Budget and recovery: docs/plans/dev-916-registry-convergence.md.
      MAX_PUBLICATION_ATTEMPTS: 73
      ARTIFACT_ID: ${{ needs.validate-release.outputs.artifact_id }}
      ARTIFACT_NAME: ${{ needs.validate-release.outputs.artifact_name }}
      ARTIFACT_DIGEST: ${{ needs.validate-release.outputs.artifact_digest }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
      TARBALL_NAME: ${{ needs.validate-release.outputs.tarball_name }}
      EXPECTED_SHA256: ${{ needs.validate-release.outputs.sha256 }}
      EXPECTED_INTEGRITY: ${{ needs.validate-release.outputs.integrity }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Require a Trusted Publishing-compatible npm
        run: |
          set -euo pipefail
          OBSERVED_NPM_VERSION="$(npm --version)" node --input-type=module <<'NODE'
          const parse = (value) => {
            const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(value);
            if (!match) throw new Error(`npm version ${value} is not a stable semantic version`);
            return match.slice(1).map(Number);
          };
          const observed = parse(process.env.OBSERVED_NPM_VERSION);
          const minimum = parse(process.env.MINIMUM_NPM_VERSION);
          const isOlder = observed.some((part, index) =>
            observed.slice(0, index).every((value, prefix) => value === minimum[prefix]) &&
            part < minimum[index],
          );
          if (isOlder) {
            throw new Error(`npm ${observed.join('.')} is below ${minimum.join('.')}`);
          }
          NODE

      - name: Verify release artifact service metadata
        id: verify-release-artifact-metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          WORKFLOW_HEAD_SHA: ${{ github.sha }}
          METADATA_PATH: ${{ runner.temp }}/release-artifact-metadata.json
        run: |
          set -euo pipefail
          gh api "repos/$EXPECTED_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$METADATA_PATH"
          node --input-type=module <<'NODE'
          // artifact-metadata-verifier:begin
          import { readFileSync } from 'node:fs';

          const artifact = JSON.parse(readFileSync(process.env.METADATA_PATH, 'utf8'));
          const fail = (message) => { throw new Error(`release artifact metadata: ${message}`); };
          if (String(artifact.id) !== process.env.ARTIFACT_ID) fail('artifact-id mismatch');
          if (artifact.name !== process.env.ARTIFACT_NAME) fail('artifact name mismatch');
          if (artifact.digest !== `sha256:${process.env.ARTIFACT_DIGEST}`) {
            fail('artifact-digest mismatch');
          }
          if (artifact.expired !== false) fail('expired artifact');
          if (String(artifact.workflow_run?.id) !== process.env.RELEASE_RUN_ID) {
            fail('workflow_run id mismatch');
          }
          if (artifact.workflow_run?.head_sha !== process.env.WORKFLOW_HEAD_SHA) {
            fail('workflow_run head_sha mismatch');
          }
          // artifact-metadata-verifier:end
          NODE

      - name: Download the exact validated artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.validate-release.outputs.artifact_id }}
          path: ${{ runner.temp }}/validated-release
          github-token: ${{ github.token }}
          repository: ${{ env.EXPECTED_REPOSITORY }}
          run-id: ${{ github.run_id }}
          merge-multiple: true

      - name: Verify release artifact bytes and package identity
        id: verify-release-artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/validated-release
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          // artifact-byte-verifier:begin
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';

          const fail = (message) => { throw new Error(`release artifact: ${message}`); };
          const expectedFiles = ['release-artifact.json', process.env.TARBALL_NAME].sort();
          const files = readdirSync(process.env.ARTIFACT_DIR).sort();
          if (JSON.stringify(files) !== JSON.stringify(expectedFiles)) {
            fail('artifact must contain only the manifest and exact tarball');
          }
          const manifestPath = join(process.env.ARTIFACT_DIR, 'release-artifact.json');
          const tarballPath = join(process.env.ARTIFACT_DIR, process.env.TARBALL_NAME);
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          const tarball = readFileSync(tarballPath);
          const expected = {
            schemaVersion: 1,
            releaseTag: process.env.RELEASE_TAG,
            version: process.env.RELEASE_VERSION,
            releaseCommit: process.env.RELEASE_COMMIT,
            packageName: process.env.EXPECTED_PACKAGE,
            tarballName: process.env.TARBALL_NAME,
            bytes: tarball.length,
            sha256: createHash('sha256').update(tarball).digest('hex'),
            integrity: `sha512-${createHash('sha512').update(tarball).digest('base64')}`,
          };
          for (const [field, value] of Object.entries(expected)) {
            if (manifest[field] !== value) fail(`manifest mismatch at ${field}`);
          }
          if (expected.sha256 !== process.env.EXPECTED_SHA256) fail('SHA-256 output mismatch');
          if (expected.integrity !== process.env.EXPECTED_INTEGRITY) fail('SHA-512 output mismatch');
          const packageManifest = JSON.parse(execFileSync(
            'tar', ['-xOf', tarballPath, 'package/package.json'], { encoding: 'utf8' },
          ));
          if (
            packageManifest.name !== process.env.EXPECTED_PACKAGE ||
            packageManifest.version !== process.env.RELEASE_VERSION
          ) {
            fail('embedded package identity mismatch');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball_path=${tarballPath}\n`);
          // artifact-byte-verifier:end
          NODE

      - name: Classify registry, publish if absent, and require provenance
        id: registry
        env:
          REGISTRY_RESPONSE: ${{ runner.temp }}/registry-version.json
          REGISTRY_ERROR: ${{ runner.temp }}/registry-version.error
          TARBALL_PATH: ${{ steps.verify-release-artifact.outputs.tarball_path }}
        run: |
          set -euo pipefail

          query_registry() {
            set +e
            npm view "$EXPECTED_PACKAGE@$RELEASE_VERSION" dist --json \
              --fetch-retries=0 --fetch-timeout=10000 > "$REGISTRY_RESPONSE" 2> "$REGISTRY_ERROR"
            npm_view_status=$?
            set -e
            NPM_VIEW_STATUS="$npm_view_status" node --input-type=module <<'NODE'
          // registry-classifier:begin
          import { readFileSync } from 'node:fs';

          const fail = (message) => { throw new Error(`registry classification: ${message}`); };
          const stdout = readFileSync(process.env.REGISTRY_RESPONSE, 'utf8');
          const stderr = readFileSync(process.env.REGISTRY_ERROR, 'utf8');
          const status = Number(process.env.NPM_VIEW_STATUS);
          if (!Number.isInteger(status) || status < 0) fail('npm exit status is invalid');

          if (status !== 0) {
            let error;
            if (stdout.trim() !== '') {
              try {
                error = JSON.parse(stdout).error;
              } catch {
                fail('npm JSON error output is malformed');
              }
              if (!error || typeof error !== 'object') {
                fail('failed npm view wrote non-error JSON output');
              }
            } else {
              const start = stderr.indexOf('{');
              const end = stderr.lastIndexOf('}');
              if (start < 0 || end <= start) fail('npm error is not structured JSON');
              try {
                error = JSON.parse(stderr.slice(start, end + 1)).error;
              } catch {
                fail('npm error is malformed JSON');
              }
            }
            const code = error?.code;
            if (code === 'E404') process.stdout.write('absent\n');
            else if (
              ['EAI_AGAIN', 'ECONNRESET', 'ECONNREFUSED', 'ENETUNREACH', 'ETIMEDOUT'].includes(code) ||
              (code === 'FETCH_ERROR' && typeof error.summary === 'string' &&
                error.summary.startsWith('network timeout at: ')) ||
              /^E5[0-9]{2}$/.test(code)
            ) process.stdout.write('retry\n');
            else fail(`fatal npm error ${String(code ?? 'unknown')}`);
          } else {
            if (stderr.trim() !== '') fail('successful npm view wrote unexpected diagnostics');
            let dist;
            try {
              dist = JSON.parse(stdout);
            } catch {
              fail('npm success output is malformed JSON');
            }
            if (dist.integrity !== process.env.EXPECTED_INTEGRITY) {
              fail('published version has different bytes');
            }
            if (
              dist.attestations?.url &&
              dist.attestations?.provenance?.predicateType === 'https://slsa.dev/provenance/v1'
            ) process.stdout.write('existing\n');
            else process.stdout.write('retry\n');
          }
          // registry-classifier:end
          NODE
          }

          state=retry
          for ((attempt=1; attempt<=MAX_CLASSIFICATION_ATTEMPTS; attempt++)); do
            state=$(query_registry)
            if [[ "$state" == existing || "$state" == absent ]]; then break; fi
            if [[ "$attempt" -lt "$MAX_CLASSIFICATION_ATTEMPTS" ]]; then sleep 5; fi
          done
          if [[ "$state" == existing ]]; then
            publication_mode=existing
          elif [[ "$state" == absent ]]; then
            publication_mode=new
            npm publish "$TARBALL_PATH" --access public --ignore-scripts
          else
            echo "Registry state did not become classifiable" >&2
            exit 1
          fi

          state=retry
          for ((attempt=1; attempt<=MAX_PUBLICATION_ATTEMPTS; attempt++)); do
            state=$(query_registry)
            if [[ "$state" == existing ]]; then break; fi
            if [[ "$attempt" -lt "$MAX_PUBLICATION_ATTEMPTS" ]]; then sleep 10; fi
          done
          if [[ "$state" != existing ]]; then
            echo "Registry integrity and provenance did not converge for $EXPECTED_PACKAGE@$RELEASE_VERSION after $MAX_PUBLICATION_ATTEMPTS observations; last state: $state." >&2
            echo "Rerun the failed publish job once npm has propagated the version and its provenance; an existing matching publication is verified without republishing." >&2
            exit 1
          fi
          echo "state=$publication_mode" >> "$GITHUB_OUTPUT"

  # This job has no OIDC or package credential. It verifies the public registry
  # result using npm's signature verifier and GitHub CLI's certificate policy.
  verify-publication:
    needs: [release-please, validate-release, publish]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_REPOSITORY: voidcorp-core/void-machine
      EXPECTED_PACKAGE: voidmachine
      VERIFIED_NPM_VERSION: 11.12.1
      MINIMUM_GH_VERSION: 2.97.0
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
      PUBLICATION_MODE: ${{ needs.publish.outputs.publication_mode }}
      CURRENT_WORKFLOW_HEAD_SHA: ${{ github.sha }}
      EXPECTED_INTEGRITY: ${{ needs.validate-release.outputs.integrity }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out the exact verification implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Pin tested npm and require the tested GitHub CLI floor
        run: |
          set -euo pipefail
          npm install --global "npm@$VERIFIED_NPM_VERSION" --ignore-scripts
          test "$(npm --version)" = "$VERIFIED_NPM_VERSION"
          node -e 'const observed=process.argv[1].match(/gh version ([0-9]+\.[0-9]+\.[0-9]+)/)?.[1]; const parts=(v)=>v.split(".").map(Number); const [a,b,c]=parts(observed||"0.0.0"); const [x,y,z]=parts(process.env.MINIMUM_GH_VERSION); if (a<x || (a===x && (b<y || (b===y && c<z)))) throw new Error(`gh ${observed||"unknown"} is below ${process.env.MINIMUM_GH_VERSION}`)' "$(gh version | head -n 1)"

      - name: Verify npm signatures and collect the exact registry tarball
        id: provenance
        working-directory: ${{ runner.temp }}
        env:
          VERIFY_ROOT: ${{ runner.temp }}/publication-verification
          NPM_AUDIT_PATH: ${{ runner.temp }}/publication-verification/npm-audit.json
          SLSA_BUNDLE_PATH: ${{ runner.temp }}/publication-verification/slsa-bundle.json
          TARBALL_PATH: ${{ runner.temp }}/publication-verification/${{ env.EXPECTED_PACKAGE }}-${{ needs.validate-release.outputs.version }}.tgz
        run: |
          set -euo pipefail
          mkdir -p "$VERIFY_ROOT"
          cd "$VERIFY_ROOT"
          npm init --yes
          npm install "$EXPECTED_PACKAGE@$RELEASE_VERSION" --ignore-scripts --package-lock=false
          npm pack "$EXPECTED_PACKAGE@$RELEASE_VERSION" --ignore-scripts --pack-destination "$VERIFY_ROOT"
          npm audit signatures --json --include-attestations > "$NPM_AUDIT_PATH"
          node "$GITHUB_WORKSPACE/release-control/scripts/verify-release-publication.mjs" extract

      - name: Verify GitHub workflow identity and signed SLSA statement
        env:
          NPM_AUDIT_PATH: ${{ runner.temp }}/publication-verification/npm-audit.json
          SLSA_BUNDLE_PATH: ${{ runner.temp }}/publication-verification/slsa-bundle.json
          GH_VERIFICATION_PATH: ${{ runner.temp }}/publication-verification/gh-verification.json
          TARBALL_PATH: ${{ runner.temp }}/publication-verification/${{ env.EXPECTED_PACKAGE }}-${{ needs.validate-release.outputs.version }}.tgz
          PRODUCER_WORKFLOW_HEAD_SHA: ${{ steps.provenance.outputs.workflow_head_sha }}
          PRODUCER_RUN_ID: ${{ steps.provenance.outputs.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.provenance.outputs.run_attempt }}
        run: |
          set -euo pipefail
          gh attestation verify "$TARBALL_PATH" \
            --bundle "$SLSA_BUNDLE_PATH" \
            --repo "$EXPECTED_REPOSITORY" \
            --signer-workflow "$EXPECTED_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --source-digest "${{ steps.provenance.outputs.workflow_head_sha }}" \
            --signer-digest "${{ steps.provenance.outputs.workflow_head_sha }}" \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --digest-alg sha512 \
            --format json > "$GH_VERIFICATION_PATH"
          node "$GITHUB_WORKSPACE/release-control/scripts/verify-release-publication.mjs" verify
