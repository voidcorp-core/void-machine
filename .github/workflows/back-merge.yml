name: back-merge

# Carry what lands on main back down to develop.
#
# `main` is the release gate: a human promotes develop to main, and only then
# does release-please propose a release. Merging that release PR writes the
# version bumps and the changelog to main, so main gains commits develop does
# not have. Branch protection is `strict`, so the next promotion is refused
# until develop catches up.
#
# That divergence is not a wiring mistake to design away. It follows from main
# being the gate: pointing release-please at develop instead would propose a
# release the moment a commit lands there, which is before the human decision
# the gate exists to make. So the repair is automated rather than the cause
# removed, and this file is the honest version of that trade.
#
# It opens a pull request rather than pushing: develop is protected with
# enforce_admins, and a branch that only a robot may bypass is not protected.
# One click, and the checks run because the App token is not GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-back-merge-main-develop
  cancel-in-progress: true

env:
  EXPECTED_REPOSITORY: voidcorp-core/void-machine
  EXPECTED_OWNER: voidcorp-core
  EXPECTED_REF: refs/heads/main
  EXPECTED_HEAD: chore/back-merge-main
  EXPECTED_BASE: develop

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the back-merge event identity
        env:
          OBSERVED_REPOSITORY: ${{ github.repository }}
          OBSERVED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$OBSERVED_REPOSITORY" != "$EXPECTED_REPOSITORY" ] ||
            [ "$OBSERVED_REF" != "$EXPECTED_REF" ]; then
            echo "back-merge is restricted to $EXPECTED_REPOSITORY at $EXPECTED_REF." >&2
            exit 1
          fi

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Open the back-merge when main holds something develop does not
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name 'voidcorp-release[bot]'
          git config user.email 'voidcorp-release[bot]@users.noreply.github.com'

          # Ancestry, not content. main requires a promotion to be up to date
          # with it, so every commit main holds must reach develop, the
          # promotion's own merge commit included: skipped because it changed
          # no file, it left the next promotion out of date with no way to
          # merge. Nobody has to read the result, which merges on its own below.
          # https://git-scm.com/docs/git-merge-base#Documentation/git-merge-base.txt---is-ancestor
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already holds main; nothing to back-merge."
            exit 0
          fi

          branch="$EXPECTED_HEAD"
          # Capture the command status: process substitution hides a failed gh
          # lookup and would mistake an API failure for an absent PR.
          pr_numbers=$(gh pr list --repo "$EXPECTED_REPOSITORY" \
            --head "$branch" --base "$EXPECTED_BASE" --state open \
            --limit 2 --json number --jq '.[].number')
          existing_prs=()
          if [ -n "$pr_numbers" ]; then
            mapfile -t existing_prs <<<"$pr_numbers"
          fi
          if [ "${#existing_prs[@]}" -gt 1 ]; then
            echo "more than one canonical back-merge pull request is open." >&2
            exit 1
          fi

          validate_identity() {
            identity=$(gh pr view "$existing" --repo "$EXPECTED_REPOSITORY" \
              --json baseRefName,headRefName,headRepository,headRepositoryOwner,isCrossRepository)
            jq -e \
              --arg repository "$EXPECTED_REPOSITORY" \
              --arg owner "$EXPECTED_OWNER" \
              --arg head "$EXPECTED_HEAD" \
              --arg base "$EXPECTED_BASE" \
              '.baseRefName == $base and .headRefName == $head and
               .headRepository.nameWithOwner == $repository and
               .headRepositoryOwner.login == $owner and
               (.isCrossRepository | not)' <<<"$identity" >/dev/null || {
              echo "the back-merge PR has the wrong repository, head, base or fork state." >&2
              exit 1
            }
          }

          if [ "${#existing_prs[@]}" -eq 1 ]; then
            existing=${existing_prs[0]}
            validate_identity
            # Queue membership is a GraphQL field, not mergeStateStatus or an
            # auto-merge request. Never rewrite or dequeue a queued head.
            queue_state=$(gh api graphql \
              -f query="query(\$owner:String!,\$name:String!,\$number:Int!){
                repository(owner:\$owner,name:\$name){
                  pullRequest(number:\$number){isInMergeQueue}
                }}" \
              -f owner="$EXPECTED_OWNER" -f name="${EXPECTED_REPOSITORY#*/}" \
              -F number="$existing")
            queued=$(jq -er '.data.repository.pullRequest.isInMergeQueue |
              if type == "boolean" then tostring else error("unknown merge queue state") end' \
              <<<"$queue_state")
            if [ "$queued" = true ]; then
              echo "back-merge PR #$existing is queued; deferred until the next push to main or manual dispatch."
              exit 0
            fi
          fi

          git checkout -B "$branch" origin/develop
          # A conflict here is a real event, not a hiccup: it means develop and
          # main both changed a file release-please owns. Fail loudly rather than
          # resolve it unattended.
          if ! git merge --no-edit origin/main; then
            echo "back-merge conflicts; resolve it by hand." >&2
            exit 1
          fi
          # GitHub still refuses a race that queues the PR after inspection.
          # Keep that refusal; never retry a push with weaker protection.
          git push --force-with-lease origin "$branch"

          if [ "${#existing_prs[@]}" -eq 0 ]; then
            # printf rather than a literal multi-line string: a body line at
            # column zero ends the YAML block scalar, which is what made this
            # workflow unparseable on its first real run. The sibling workflow
            # survived only because it already used this form.
            (gh pr create --repo "$EXPECTED_REPOSITORY" \
              --base "$EXPECTED_BASE" --head "$branch" \
              --title 'chore: back-merge main into develop' \
              --body "$(printf '%s\n\n%s\n' \
                'Release-please writes the version bumps and the changelog to `main`, so `main` gains commits `develop` does not have and branch protection refuses the next promotion until they meet. This carries them back down.' \
                'Merged automatically once the required checks pass, and only then. It is the one pull request the independent review verdict exempts: its whole content is the release output a human already approved by merging the release pull request, and asking for it to be read a second time is ceremony, not review.')" \
              >/dev/null)
            # `gh pr create` prints a URL, not JSON, so the number is read back
            # from the branch rather than parsed out of its output.
            existing=$(gh pr view "$branch" --repo "$EXPECTED_REPOSITORY" \
              --json number --jq '.number')
          else
            existing=${existing_prs[0]}
            echo "back-merge pull request already open; it now carries the newer main."
          fi

          validate_identity

          # Native auto-merge, which waits for the required checks and respects
          # branch protection. It does not bypass anything: if a check fails the
          # pull request simply stays open.
          gh pr merge "$existing" --repo "$EXPECTED_REPOSITORY" --auto --merge
